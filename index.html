<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step and Activity Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="row mb-3">
            <div class="col-6">
                <button id="addStep" class="btn btn-primary">Add Step</button>
            </div>
            <div class="col-6 text-end">
                <input type="text" id="jsonName" class="form-control d-inline-block w-auto" placeholder="JSON Name">
                <button id="createJson" class="btn btn-success">Create JSON</button>
            </div>
        </div>
        <div id="stepsContainer"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
